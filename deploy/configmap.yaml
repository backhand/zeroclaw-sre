# Non-secret tunables. Everything here ends up in the rendered config.toml, so
# it is safe to read, diff and review — nothing confidential belongs in this
# file. Credentials live in the Secret (deploy/secret.example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: zeroclaw-sre
  namespace: zeroclaw-sre
  labels:
    app.kubernetes.io/name: zeroclaw-sre
data:
  # ── Chat targets ───────────────────────────────────────────────
  # OPTIONAL filter. Empty (the default) means the bot listens wherever it has
  # been invited — invite it to a channel and it works there. Set it only to
  # narrow that. Access control is ZC_ALLOWED_USERS below, not this list.
  SLACK_CHANNEL_IDS: ""

  # REQUIRED for scheduled output. The sweep digest and heartbeat are proactive
  # messages with no incoming message to reply to, so they need a destination.
  # A channel ID (C…), from the channel's details pane in Slack.
  SLACK_DIGEST_CHANNEL: ""

  # Discord guild the bot is restricted to, and the channels it watches.
  DISCORD_GUILD_ID: "000000000000000000"
  DISCORD_CHANNEL_IDS: "000000000000000000"
  DISCORD_DIGEST_CHANNEL: ""

  # Operator IDs allowed to approve mutations and ask questions. Slack user IDs
  # (U…) and Discord user IDs respectively; ZC_ALLOWED_USERS sets both at once.
  # Leaving this empty means nobody can approve a rightsizing patch.
  ZC_ALLOWED_USERS: ""
  # ZC_ALLOWED_USERS_SLACK: "U0000000000"
  # ZC_ALLOWED_USERS_DISCORD: "000000000000000000"

  # ── Scope ──────────────────────────────────────────────────────
  # Comma-separated namespaces the agent may WRITE to. Empty = read-only
  # everywhere. Must match the RoleBindings in deploy/rbac.yaml: this variable
  # narrows intent, RBAC decides what is possible.
  ALLOWED_NAMESPACES: "default"

  # ── Schedules (5-field cron, UTC) ──────────────────────────────
  SWEEP_CRON: "*/15 * * * *"
  RIGHTSIZE_CRON: "0 6 * * 1"
  HEARTBEAT_CRON: "0 7 * * *"

  # ── Model ──────────────────────────────────────────────────────
  # Provider family and model. The family names a `[providers.models.<family>]`
  # group that ZeroClaw knows (anthropic, openai, xai, gemini, ollama, groq,
  # openrouter, …); the key in the Secret is used for whichever you pick.
  # `zeroclaw providers` lists them all.
  ZC_PROVIDER_FAMILY: "anthropic"
  ZC_MODEL: "claude-sonnet-4-5"

  # ── Chat routing ───────────────────────────────────────────────
  # Which channels the agent serves, which one receives the scheduled digest,
  # and which one it is fanned out to. Change these only if you rename or add
  # channel blocks in config.toml.tmpl.
  ZC_AGENT_CHANNELS: "slack.ops,discord.ops"
  ZC_DIGEST_CHANNEL_REF: "slack.ops"
  ZC_FANOUT_CHANNEL_REF: "discord.ops"

  # ── Ticketing ──────────────────────────────────────────────────
  # OPTIONAL last-resort default. Ticket filing is enabled by GH_TOKEN in the
  # Secret, not by this. Each workload's repo comes from its
  # sre.zeroclaw/github-repo annotation or the repo map, and the agent asks in
  # chat once for anything that has neither. Set this only if a single repo is
  # a sensible catch-all for the whole cluster.
  GH_REPO: ""

  # ── Sandbox ────────────────────────────────────────────────────
  # "none" in-cluster: ZeroClaw's landlock backend allowlists only the
  # workspace, /tmp and the system dirs, which would cut kubectl off from the
  # projected ServiceAccount token and break in-cluster auth entirely. The
  # container itself (non-root, read-only rootfs, dropped caps, RuntimeDefault
  # seccomp) plus RBAC is the isolation boundary. See NOTES.md §6 before
  # changing this to "landlock".
  ZC_SANDBOX_BACKEND: "none"
