# Placeholder values only. Never commit a filled-in copy of this file.
#
# Create the real Secret from your environment instead of editing YAML:
#
#   kubectl -n zeroclaw-sre create secret generic zeroclaw-sre \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=SLACK_BOT_TOKEN="$SLACK_BOT_TOKEN" \
#     --from-literal=SLACK_APP_TOKEN="$SLACK_APP_TOKEN" \
#     --from-literal=DISCORD_BOT_TOKEN="$DISCORD_BOT_TOKEN" \
#     --from-literal=ZC_WEBHOOK_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ZC_GATEWAY_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=GH_TOKEN="$GH_TOKEN"
#
# Every one of these reaches ZeroClaw as an environment variable and is turned
# into an in-memory config override by entrypoint.sh. None is ever written to
# the rendered config.toml, the PVC, or an image layer.
apiVersion: v1
kind: Secret
metadata:
  name: zeroclaw-sre
  namespace: zeroclaw-sre
  labels:
    app.kubernetes.io/name: zeroclaw-sre
type: Opaque
stringData:
  # ── Required ───────────────────────────────────────────────────
  # Anthropic API key. Becomes providers.models.anthropic.sre.api_key.
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"

  # Slack app, Socket Mode. Bot token needs: app_mentions:read, channels:history,
  # chat:write, groups:history, reactions:read, users:read.
  # App token needs connections:write. No signing secret is required — Socket
  # Mode authenticates with the app token (see NOTES.md §4).
  SLACK_BOT_TOKEN: "xoxb-REPLACE_ME"
  SLACK_APP_TOKEN: "xapp-REPLACE_ME"

  # Discord bot token. Enable the Message Content and Server Members intents in
  # the Developer Portal, and invite the bot with Send Messages + Read Message
  # History in the ops channel.
  DISCORD_BOT_TOKEN: "REPLACE_ME"

  # Shared secret Alertmanager must send as X-Webhook-Secret. Generate with
  # `openssl rand -hex 32`. Checked by the adapter and again by the gateway.
  ZC_WEBHOOK_SECRET: "REPLACE_ME_32_BYTES_HEX"

  # Pre-seeded gateway bearer token, so the adapter authenticates without an
  # interactive `POST /pair`. Generate with `openssl rand -hex 32`.
  # Becomes gateway.paired_tokens (NOTES.md §3).
  ZC_GATEWAY_TOKEN: "REPLACE_ME_32_BYTES_HEX"

  # ── Optional ───────────────────────────────────────────────────
  # GitHub token for ticket filing (FR4). Needs `repo` scope on GH_REPO, or
  # `issues: write` on a fine-grained token. Omit both this and GH_REPO to run
  # without ticket filing — the agent logs a warning and reports to chat only.
  GH_TOKEN: ""

  # Accepted for compatibility with the spec's variable list; unused.
  # SLACK_SIGNING_SECRET: ""
