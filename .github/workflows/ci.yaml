name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint / static (spec §10.1) ──────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks wants history

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: alert-adapter/go.mod

      - name: Install shellcheck and gettext
        run: sudo apt-get update && sudo apt-get install -y shellcheck gettext

      - name: Install gitleaks
        run: |
          version=8.28.0
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - run: make lint-shell
      - run: make lint-yaml
      - run: make lint-go
      - run: make render-check
      - run: make secret-scan

  # ── 2. Build the image and validate it from the inside (§10.2) ─
  image:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build (host arch, loaded locally)
        run: make build

      # zeroclaw sop validate + skills audit + skills test + doctor, against a
      # config rendered exactly the way the pod renders it.
      - name: In-image self-test
        run: make image-test

      - name: No writable state paths outside /data and /tmp
        run: make image-scan

      - name: Save the image for the e2e job
        run: docker save zeroclaw-sre:dev -o /tmp/zeroclaw-sre.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/zeroclaw-sre.tar
          retention-days: 1

  # ── 3. Acceptance on k3d (§10.4, §11) ──────────────────────────
  #
  # amd64 only, as the spec requires. Cases that need a real model call are
  # skipped unless ANTHROPIC_API_KEY is present in repository secrets — they
  # are skipped loudly, never faked.
  e2e:
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - name: Load the image
        run: docker load -i /tmp/zeroclaw-sre.tar

      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Acceptance suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          E2E_GH_REPO: ${{ vars.E2E_GH_REPO }}
        run: make e2e

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n zeroclaw-sre describe pod -l app.kubernetes.io/name=zeroclaw-sre || true
          kubectl -n zeroclaw-sre logs deploy/zeroclaw-sre -c zeroclaw --tail=200 || true
          kubectl -n zeroclaw-sre logs deploy/zeroclaw-sre -c alert-adapter --tail=100 || true
