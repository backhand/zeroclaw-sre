[sop]
name = "prune-replicasets"
description = "Remove superseded, scaled-to-zero ReplicaSets, keeping recent revisions for rollback. Deletes nothing without operator approval."
version = "1.0.0"
priority = "low"
execution_mode = "supervised"
agent = "sre"
# Serialize: two runs would compute overlapping candidate lists and race each
# other's deletes.
max_concurrent = 1
admission_policy = "hold"
max_pending_approvals = 1
cooldown_secs = 3600

[[triggers]]
type = "manual"
