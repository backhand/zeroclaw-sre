# A workload that asks for far more than it uses, so the rightsize SOP has
# something unambiguous to propose. It sleeps: CPU ~0, memory a few MiB,
# against a 500m/512Mi request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovisioned
  namespace: e2e-apps
  labels: { app: overprovisioned }
spec:
  replicas: 1
  selector:
    matchLabels: { app: overprovisioned }
  template:
    metadata:
      labels: { app: overprovisioned }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
