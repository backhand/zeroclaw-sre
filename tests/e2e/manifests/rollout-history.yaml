# A workload that has been rolled several times, so there are superseded
# ReplicaSets to prune. run.sh rolls it after applying; one apply alone yields a
# single current ReplicaSet and nothing prunable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolled
  namespace: e2e-apps
  labels: { app: rolled }
spec:
  replicas: 1
  # Above the number of rollouts, so Kubernetes' own pruning does not remove
  # the candidates before the test looks for them.
  revisionHistoryLimit: 20
  selector:
    matchLabels: { app: rolled }
  template:
    metadata:
      labels: { app: rolled }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
