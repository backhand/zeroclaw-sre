title = "zeroclaw-k3s-sre"

# Keep every default rule. This file only *exempts* things, and it must never
# add a rule: a `[[rules]]` block here would define a new detector, not an
# exception, and would flag the very placeholders it was meant to excuse.
[extend]
useDefault = true

[allowlist]
description = "Documented placeholders and the files that exist to show where a credential goes"

# Literal placeholder strings that appear by design.
regexes = [
  '''REPLACE_ME''',
  '''selftest''',
  '''e2e-placeholder''',
  '''xoxb-e2e''',
  '''xapp-e2e''',
]

# Files whose whole purpose is to name credential-shaped things.
paths = [
  '''deploy/secret\.example\.yaml''',
  '''README\.md''',
  '''NOTES\.md''',
  '''zeroclaw-k3s-sre-spec\.md''',
  '''tests/e2e/.*''',
  '''workspace/skills/k3s-admin/TEST\.sh''',
  '''Makefile''',
  '''\.gitleaks\.toml''',
]
